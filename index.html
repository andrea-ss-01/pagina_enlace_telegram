<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enviar mensaje a Telegram</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="contenedor">
        <section class="tarjeta">

            <div class="icono">✈️</div>

            <h1>Enviar mensaje a Telegram</h1>

            <p class="descripcion">
                Escribe el Chat ID y el mensaje que deseas enviar.
            </p>

            <form id="telegramForm">

                <label for="chatId">Chat ID</label>

                <input
                    type="text"
                    id="chatId"
                    placeholder="Ejemplo: 123456789"
                    required
                >

                <small>
                    Puedes colocar un Chat ID diferente cada vez.
                </small>

                <label for="mensaje">Mensaje</label>

                <textarea
                    id="mensaje"
                    rows="5"
                    placeholder="Escribe tu mensaje aquí..."
                    required
                ></textarea>

                <button type="submit" id="btnEnviar">
                    Enviar mensaje
                </button>

            </form>

            <div id="estado" class="estado">
                Estado: Listo para enviar
            </div>

        </section>
    </main>
    <footer>
    Creado por: <strong>Andrea Samaniego</strong> y <strong>Kelly Mendieta</strong>
</footer>

    <script src="script.js"></script>

</body>
</html>
